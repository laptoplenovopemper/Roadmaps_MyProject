<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. STONE Science Crafting Roadmap</title>
  <!-- CDN Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header Control Bar -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between z-20">
    <div class="flex items-center gap-3">
      <div class="bg-amber-500 text-slate-950 px-2 py-1 rounded font-black text-xs uppercase tracking-wider">
        Crafting Map
      </div>
      <h1 id="project-title" class="text-xl font-bold text-slate-100">PROYEK SAINS DR. STONE</h1>
      <button id="btn-edit-project" class="text-slate-400 hover:text-amber-400 text-xs transition">
        <i class="fa-solid fa-pen"></i> Edit
      </button>
    </div>

    <!-- Progress & Action Buttons -->
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-3 bg-slate-950 px-4 py-1.5 rounded-lg border border-slate-800">
        <div class="text-xs text-slate-400">Progress Penemuan:</div>
        <div class="w-32 bg-slate-800 h-2 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <div class="text-xs font-mono font-bold text-emerald-400">
          <span id="stat-acquired">0</span>/<span id="stat-total">0</span> (<span id="stat-progress">0%</span>)
        </div>
      </div>

      <div class="flex gap-2">
        <button id="btn-add-node" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1.5 transition">
          <i class="fa-solid fa-plus"></i> Tambah Node
        </button>
        <button id="btn-export" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg font-semibold text-xs border border-slate-700 transition">
          <i class="fa-solid fa-download"></i> Export JSON
        </button>
        <button id="btn-reset" class="bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-300 px-3 py-1.5 rounded-lg text-xs border border-slate-700 transition">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
      </div>
    </div>
  </header>

  <!-- Interactive Map Canvas -->
  <main class="flex-1 relative overflow-auto bg-slate-950 bg-grid-pattern p-10">
    <div id="map-canvas" class="relative min-w-[1200px] min-h-[700px]">
      <!-- SVG Layer for Connection Lines -->
      <svg id="connections-layer" class="absolute inset-0 w-full h-full"></svg>
      <!-- Nodes rendered dynamically by app.js -->
    </div>
  </main>

  <!-- Modal Edit/Tambah Node -->
  <div id="node-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
        <h3 id="modal-title" class="font-bold text-amber-400">Edit Node Penemuan</h3>
        <button id="btn-close-modal" class="text-slate-500 hover:text-slate-300">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="node-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Judul Penemuan / Item</label>
          <input type="text" id="node-title" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500" placeholder="contoh: Mobil Sains" />
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Keterangan / Bahan</label>
          <textarea id="node-desc" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500" placeholder="Detail singkat project..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Icon (FontAwesome)</label>
            <select id="node-icon" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
              <option value="fa-flask">🧪 Flask (Sains)</option>
              <option value="fa-fire">🔥 Fire (Energi/Api)</option>
              <option value="fa-gem">💎 Gem (Material)</option>
              <option value="fa-car-side">🚗 Vehicle (Kendaraan)</option>
              <option value="fa-bolt">⚡ Electricity (Listrik)</option>
              <option value="fa-dumpster-fire">🏭 Furnace (Pabrik/Tungku)</option>
              <option value="fa-shield-halved">🛡️ Shield (Baja/Armor)</option>
              <option value="fa-play">▶️ Start Node</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Status Penemuan</label>
            <select id="node-status" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
              <option value="locked">🔒 Locked (Belum)</option>
              <option value="in-progress">⏳ Crafting (Proses)</option>
              <option value="completed">✅ Acquired (Selesai)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Syarat / Parent (Bisa pilih banyak)</label>
          <select id="node-parents" multiple class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500 h-24">
            <!-- Dynamic options -->
          </select>
          <span class="text-[10px] text-slate-500">Tahan tombol Ctrl / Cmd untuk memilih beberapa parent.</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Posisi Horisontal (X px)</label>
            <input type="number" id="node-pos-x" step="10" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Posisi Vertikal (Y px)</label>
            <input type="number" id="node-pos-y" step="10" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-100" />
          </div>
        </div>

        <div class="flex justify-between items-center pt-2 border-t border-slate-800">
          <button type="button" id="btn-delete-node" class="text-xs text-red-400 hover:text-red-300 font-semibold flex items-center gap-1">
            <i class="fa-solid fa-trash"></i> Hapus Node
          </button>
          <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-lg font-bold text-xs transition">
            Simpan Penemuan
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- External JS Script -->
  <script src="app.js"></script>
</body>
</html>
